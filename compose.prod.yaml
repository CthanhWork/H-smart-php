# Docker Compose configuration for production deployment
# Copy this to compose.yaml and adjust as needed

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hsmart
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - hsmart-network

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Application
      APP_NAME: H-Smart
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}

      # Database
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: hsmart
      DB_USERNAME: hsmart
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      # Mail (configure SMTP for production)
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@hsmart.local}
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-H-Smart}"

      # Frontend URL and CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

      # Security
      HASH_DRIVER: argon2id

    volumes:
      - backend_config:/run/hsmart
      - backend_storage:/var/www/html/storage
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - hsmart-network

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      # Remove VITE_DEMO_MAILBOX_URL in production
    ports:
      - "${FRONTEND_PORT:-127.0.0.1:5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - hsmart-network

  # Optional: Mailpit for testing (remove in production)
  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    networks:
      - hsmart-network
    profiles:
      - development

volumes:
  postgres_data:
    driver: local
  backend_config:
    driver: local
  backend_storage:
    driver: local
  mailpit_data:
    driver: local

networks:
  hsmart-network:
    driver: bridge

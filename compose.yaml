services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hsmart
      POSTGRES_USER: hsmart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run docker-start.ps1 to create the local database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hsmart -d hsmart"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:8025:8025"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: hsmart
      DB_USERNAME: hsmart
      DB_PASSWORD: ${DB_PASSWORD:?Run docker-start.ps1 to create the local database password}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SCHEME: smtp
      MAIL_FROM_ADDRESS: noreply@hsmart.local
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - backend_config:/run/hsmart
      - backend_storage:/var/www/html/storage
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_DEMO_MAILBOX_URL: http://localhost:8025
    ports:
      - "127.0.0.1:5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  postgres_data:
  backend_config:
  backend_storage:
  mailpit_data:
